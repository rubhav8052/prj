name: Docker build and push to Argo PROD

on:
  push:
    branches:
      - main
      - "**"

env:
  IMAGE_NAME: voxel-teams-vizu
  AZURE_CLIENT_ID: ${{ secrets.SP_APPLICATION_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.SP_SECRET_VALUE }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  env: PROD

jobs:
  buildprod:
    environment: PROD
    runs-on: ${{ fromJson(vars.ADA_RUNNER_DEFAULT_LABELS) }}
    name: Docker push to DLL PROD ACR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Logging into ACR Prod
        uses: docker/login-action@v3
        with:
          registry: crdllprod.azurecr.io
          username: ${{ secrets.SP_APPLICATION_ID }}
          password: ${{ secrets.SP_SECRET_VALUE }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: crdllprod.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./src/voxel_teams/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            "artifactory_user=${{ secrets.JCA_ARTIFACTORY_PROD_USER }}"
            "artifactory_token=${{ secrets.JCA_ARTIFACTORY_PROD_TOKEN }}"