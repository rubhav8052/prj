    # output_file: ${inference.paths.base_workspace_path}/raw_output/deepseek/inference_outputs/v4-20260201-202214/frozen_vit_frozen_llm_90_output.json
    prompt_module: src.prompts.tl_inlay_prompt
    prompt_variable: tl_inlay_prompt

  QWEN_CONFIG:
    # model_name: ${inference.paths.base_workspace_path}/attribute_labeling/traffic_lights_inlay/qwen/exported/v0-20250904-121124/
    model_name: null
    max_model_len: 4096
    max_num_seqs: 5
    batch_size: 16
    # output_file: ${inference.paths.base_workspace_path}/attribute_labeling/traffic_lights_inlay/qwen/inference_outputs/v0-20250904-121124/frozen_vit_frozen_llm_90_output.json
    output_file: null
    prompt_module: src.prompts.tl_inlay_prompt
    prompt_variable: tl_inlay_prompt

  # ----------------------------
  # Sampling params
  # ----------------------------
  SAMPLING_PARAMS:
    temperature: 0.7
    top_p: 0.8
    repetition_penalty: 1.05
    max_tokens: 5000

# ============================================================
# PIPELINE CONTROL
# ============================================================

model: deepseek

pipeline:
  stages:
    data_preparation: true
    training: true
    inference: true
